@font-face{font-family:'Penpoint';src:url('./assets/e9d9f28ee1522a75635f0352c96fc9a9.otf');font-weight:400;font-style:normal;font-display:swap}
.mf-pg{position:relative;box-sizing:border-box;width:100%;min-height:100vh;
/* the screen as it actually is, with the browser bars showing */
min-height:100dvh;
display:flex;flex-direction:column;background-color:#FBF6E6;color:#262525;
font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:300;overflow-x:hidden}
.mf-grid{position:absolute;left:0;top:0;right:0;bottom:0;z-index:0;pointer-events:none;
opacity:0.17;background-image:linear-gradient(to right,#2A4A86 1px,transparent 1px),
linear-gradient(to bottom,#2A4A86 1px,transparent 1px);background-size:17px 17px}
.mf-hand{font-family:'Penpoint','Bradley Hand','Segoe Print',cursive;font-weight:400}

.mf-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
gap:10px;padding:16px;border-bottom:1px solid rgba(156,151,149,0.45)}
.mf-top a{color:#262525;text-decoration:none;font-size:10px;letter-spacing:0.18em;
text-transform:uppercase;font-weight:500;-webkit-tap-highlight-color:transparent}
.mf-top nav{display:flex;gap:14px}
.mf-top a:active{color:#C62B23}

.mf-marq{position:relative;z-index:2;overflow:hidden;padding:12px 0;
border-bottom:1px solid rgba(38,37,37,0.5)}
.mf-track{display:flex;width:max-content;animation:mf-roll 22s linear infinite}
.mf-track span{flex:0 0 auto;padding-right:40px;font-size:54px;line-height:1;font-weight:300;
letter-spacing:-0.06em;text-transform:uppercase;white-space:nowrap}
@keyframes mf-roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.mf-canvas{position:relative;z-index:2;flex:1 1 auto;display:flex;flex-direction:column;
align-items:center;justify-content:center;padding:26px 10px 30px}

.mf-foot{position:relative;z-index:2}
.mf-fnav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
padding:13px 16px;background-color:#FEF9ED;
background-image:linear-gradient(to right,rgba(36,25,16,0.07) 1px,transparent 1px),
linear-gradient(to bottom,rgba(36,25,16,0.07) 1px,transparent 1px);
background-size:13px 13px;border-top:1px solid rgba(36,25,16,0.18);
font-family:'Penpoint','Bradley Hand','Segoe Print',cursive;font-weight:400;font-size:14px}
.mf-fnav a{color:#241910;text-decoration:none;-webkit-tap-highlight-color:transparent}
.mf-fnav a:active{color:#C62B23}
.mf-fnav > :nth-child(1){justify-self:start}
.mf-fnav > :nth-child(2){justify-self:center}
.mf-fnav > :nth-child(3){justify-self:end}
.mf-contact{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;
gap:4px 9px;padding:14px;border-top:1px solid rgba(36,25,16,0.25);background-color:#FEF9ED}
.mf-contact a{color:#241910;text-decoration:none;-webkit-tap-highlight-color:transparent}
.mf-contact .mf-hand{font-size:11px}
.mf-contact .mf-dot{color:#9C9795;font-size:10px}

/* ---- the fan ------------------------------------------------------ */
.fl-stage{position:relative;display:flex;align-items:center;justify-content:center;
width:100%;outline:none}
.fl-deck{position:relative;width:309px;height:376px;touch-action:pan-x}
.fl-card{position:absolute;left:50%;top:50%;width:278px;height:170px;
margin-left:-139px;margin-top:-85px;padding:0;border:0;background:transparent;
transform-origin:center center;cursor:zoom-in;-webkit-tap-highlight-color:transparent;
transition:transform 620ms cubic-bezier(.22,1,.36,1)}
.fl-cardin{display:block;width:100%;height:100%;overflow:hidden;
border:1px solid rgba(38,37,37,0.28);border-radius:9px;background-color:#FFFFFF;
box-shadow:0 12px 28px rgba(0,0,0,0.14),0 2px 8px rgba(0,0,0,0.08);
transition:transform 280ms cubic-bezier(.22,1,.36,1)}
.fl-cardin > *{display:block;width:100%!important;height:100%!important}
.fl-cardin img{width:100%!important;height:100%!important;object-fit:cover!important}
.fl-card:hover,.fl-card:focus-visible{z-index:99!important;outline:none}
.fl-card:hover .fl-cardin,.fl-card:focus-visible .fl-cardin{
transform:scale(1.07)}
.fl-hint{margin:20px 0 0;text-align:center;color:#786653;font-size:9px;

.fl-lb{position:fixed;left:0;top:0;right:0;bottom:0;z-index:95;display:flex;

.fl-lbveil{position:absolute;left:0;top:0;right:0;bottom:0;z-index:0;border:0;padding:0;
background:transparent;cursor:zoom-out}

   is fitted into, and the slot board's own white ground is cleared with
   it - that ground is what showed above and below a wide picture. */
.fl-lbframe{position:relative;z-index:2;box-sizing:border-box;width:100%;max-width:430px;height:100%;padding:0;background:transparent}
.fl-lbslide{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden}
.fl-lbslide,.fl-lbslide *{background-color:transparent!important}
.fl-lbslide > *{display:block;width:100%!important;height:100%!important}
.fl-lbslide img{width:100%!important;height:100%!important;object-fit:contain!important}
.fl-lbtap{position:absolute;left:0;top:0;right:0;bottom:0;z-index:3;

.fl-lbbtn{position:absolute;z-index:4;display:flex;align-items:center;justify-content:center;

line-height:1;cursor:pointer}
.fl-lbprev{left:13px;bottom:13px}
.fl-lbnext{right:13px;bottom:13px}
.fl-lbx{right:13px;top:13px}

font-weight:500}

.xk-ring{position:absolute;left:-11px;top:-9px;width:calc(100% + 22px);

a.xk:hover .xk-a,a.xk:focus-visible .xk-a,a.xk:active .xk-a{

@keyframes xk-draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
