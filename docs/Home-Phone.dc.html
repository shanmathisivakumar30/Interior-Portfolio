<x-dc>
<helmet>
<style>
@font-face{font-family:'Bebas Neue';src:url('./assets/52846e07bbe4848363c5a3aad3642df9.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}

/* every class here is ph- prefixed: this artboard is mounted inside the
   desktop page, so the two stylesheets share one document */
.ph-home{position:relative;box-sizing:border-box;display:flex;flex-direction:column;
width:100%;min-height:100vh;min-height:100dvh;padding:18px 18px 26px;
background-color:#FEF9ED;
background-image:linear-gradient(to right,rgba(36,25,16,0.055) 1px,transparent 1px),
linear-gradient(to bottom,rgba(36,25,16,0.055) 1px,transparent 1px);
background-size:26px 26px;color:#241910;
font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:300;overflow-x:hidden}
.ph-wrap{display:flex;flex-direction:column;flex:1 1 auto;width:100%;max-width:430px;margin:0 auto}

.ph-nav{display:flex;align-items:center;justify-content:center;gap:10px;padding:2px 0 0}
.ph-navlink{position:relative;display:inline-flex;align-items:center;padding:9px 16px;
text-decoration:none;-webkit-tap-highlight-color:transparent}
.ph-navlink img{display:block;height:24px;width:auto}
.ph-ring{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ph-ring path{fill:none;stroke:#C8432B;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
vector-effect:non-scaling-stroke;stroke-dasharray:1200;stroke-dashoffset:1200}
.ph-navlink:active .ph-ring path,.ph-navlink:focus-visible .ph-ring path,
.ph-navlink.xk-on .ph-ring path{
animation:ph-circle 420ms cubic-bezier(.35,.75,.4,1) forwards}
@keyframes ph-circle{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
.ph-navlink:focus{outline:none}

/* the drawing and the greeting share the middle, centred together */
.ph-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;
flex:1 1 auto;gap:22px;padding:10px 0 4px}

.ph-art{position:relative;display:block;width:100%;padding:0;border:0;background:transparent;
cursor:pointer;-webkit-tap-highlight-color:transparent}
.ph-art img{display:block;width:100%;height:auto}
.ph-art .ph-plant,.ph-art .ph-beams{position:absolute;left:0;top:0;width:100%;height:100%}
.ph-plant{transform-origin:8% 88%}
.ph-beams{pointer-events:none;opacity:0;transition:opacity 420ms ease}
.ph-art.ph-lit .ph-beams{opacity:1}
.ph-art.ph-lit .ph-room{animation:ph-shake 640ms ease-in-out}
.ph-art.ph-lit .ph-plant{animation:ph-leaf 820ms ease-in-out}
/* the opening flicker: only the light moves, the drawing stays put */
.ph-art.ph-flick .ph-beams{transition:opacity 90ms linear}
.ph-art.ph-flick .ph-room,.ph-art.ph-flick .ph-plant{animation:none}
@keyframes ph-shake{
0%,100%{transform:translate(0,0) rotate(0deg)}
18%{transform:translate(-2.5px,1px) rotate(-0.22deg)}
38%{transform:translate(2.5px,-1.5px) rotate(0.28deg)}
58%{transform:translate(-1.8px,-1px) rotate(-0.18deg)}
80%{transform:translate(1.4px,1px) rotate(0.12deg)}}
@keyframes ph-leaf{
0%,100%{transform:rotate(0deg) translate(0,0)}
14%{transform:rotate(-1.5deg) translate(-1.5px,0)}
32%{transform:rotate(1.7deg) translate(1.5px,-1.5px)}
52%{transform:rotate(-1.1deg) translate(-1px,1px)}
74%{transform:rotate(0.8deg) translate(1px,0)}}

.ph-greet{margin:0;font-family:'Bebas Neue','Helvetica Neue',Helvetica,Arial,sans-serif;
font-weight:400;font-size:26px;letter-spacing:0.12em;text-indent:0.12em;line-height:1.25;
text-align:center;text-transform:uppercase;color:#241910}

.ph-hint{margin:0;padding-top:2px;text-align:center;color:#9C9795;font-size:9px;
letter-spacing:0.2em;text-transform:uppercase;font-weight:500;
opacity:0;transition:opacity 300ms ease}
.ph-hint.ph-on{opacity:1}
.ph-hint.ph-off{opacity:0}

@media (prefers-reduced-motion:reduce){
.ph-art.ph-lit .ph-room,.ph-art.ph-lit .ph-plant{animation:none}
.ph-beams{transition:none}
.ph-ring path{stroke-dashoffset:0}
.ph-navlink:active .ph-ring path,.ph-navlink.xk-on .ph-ring path{animation:none}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
componentDidMount() {
this.xkWatch('a.ph-navlink');
let reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
if (reduced) { this.setState({ done: true }); return; }
this._seq = [];
// the first arrival is this mount; the ones after it are caught below
this._lampAt = Date.now();
this.lampWait();
this.lampWatch();
}
// A tap is not a hover. The ring goes on when the finger lands, and the
// link is held for as long as the ring takes to draw, so it is seen
// instead of guessed at. Held back only on a touch screen and only on the
// page itself - inside the editor the runtime moves between artboards.
xkBind(sel) {
let touch = false, own = false, red = false;
try { touch = window.matchMedia('(hover: none)').matches; } catch (e) {}
try { own = window.top === window.self; } catch (e) { own = false; }
try { red = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
let links = [];
try { links = document.querySelectorAll(sel || 'a.xk'); } catch (e) { return; }
for (let i = 0; i < links.length; i++) {
const a = links[i];
if (a._xkOn) continue;
a._xkOn = 1;
const draw = () => {
// remove, reflow, add: that is what restarts the stroke
try { a.classList.remove('xk-on'); void a.offsetWidth; a.classList.add('xk-on'); } catch (e) {}
};
try { a.addEventListener('touchstart', draw, { passive: true }); } catch (e) {}
if (!touch || !own || red) continue;
a.addEventListener('click', (ev) => {
if (a._xkGo) { a._xkGo = false; return; }
const href = a.getAttribute('href') || '';
if (!href || href.charAt(0) === '#' || a.getAttribute('target')) return;
ev.preventDefault();
ev.stopPropagation();
draw();
a._xkGo = true;
setTimeout(() => {
try { a.click(); } catch (e) { try { window.location.href = href; } catch (x) {} }
}, 400);
});
}
}
xkWatch(sel) {
this.xkBind(sel);
try { [0, 400, 1400].forEach((t) => setTimeout(() => this.xkBind(sel), t)); } catch (e) {}
}
// Every arrival deserves the flicker, not just the first. Coming back with
// the back button often restores the page whole from the browser's cache,
// so nothing mounts and nothing fired; the tab coming back to the front
// and the drawing returning to the screen count as arrivals too.
lampWatch() {
this._lampVis = () => { try { if (!document.hidden) this.lampAgain(); } catch (e) {} };
try { document.addEventListener('visibilitychange', this._lampVis); } catch (e) {}
try { window.addEventListener('pageshow', this._lampVis); } catch (e) {}
try {
const el = this.lampArt();
if (el && typeof IntersectionObserver !== 'undefined') {
this._lampBack = new IntersectionObserver((es) => {
es.forEach((e) => {
if (!e.isIntersecting) { this._lampOut = true; return; }
if (this._lampOut) { this._lampOut = false; this.lampAgain(); }
});
}, { threshold: 0.1 });
this._lampBack.observe(el);
}
} catch (e) {}
}
lampAgain() {
let red = false;
try { red = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
if (red) return;
const now = Date.now();
if (this._lampAt && now - this._lampAt < 4000) return;
this._lampAt = now;
try { (this._seq || []).forEach(clearTimeout); } catch (e) {}
this._seq = [];
try { clearTimeout(this._lit); } catch (e) {}
this._lampOn = false;
this.setState({ flick: false, lit: false, done: false, touched: false });
this.lampWait();
}
lampArt() { try { return document.querySelector('.ph-art'); } catch (e) { return null; } }
// The strikes were being spent before the page was worth looking at: they
// fired a third of a second after mounting, which on a phone is usually
// before the drawing has loaded. Wait for the picture, then for the drawing
// to actually be on screen, and only then strike.
lampWait() {
if (this._lampOn) return;
const el = this.lampArt();
if (!el) { this._seq.push(setTimeout(() => this.lampWait(), 120)); return; }
const img = el.querySelector('.ph-room');
if (img && !img.complete) {
try { img.addEventListener('load', () => this.lampWait(), { once: true }); } catch (e) {}
this._seq.push(setTimeout(() => this.lampWait(), 1200));   // and a backstop
return;
}
let watched = false;
try {
if (typeof IntersectionObserver !== 'undefined') {
this._lampIO = new IntersectionObserver((es) => {
es.forEach((e) => {
if (!e.isIntersecting) return;
try { this._lampIO.disconnect(); } catch (x) {}
this._lampIO = null;
this.lampStrike();
});
}, { threshold: 0.3 });
this._lampIO.observe(el);
watched = true;
}
} catch (e) { watched = false; }
if (!watched) this.lampStrike();
}
lampStrike() {
if (this._lampOn) return;
this._lampOn = true;
this._lampAt = Date.now();
// four strikes, slow enough to read as a lamp being switched on
const ON = 260, OFF = 210, START = 380, TIMES = 4;
let t = START;
for (let k = 0; k < TIMES; k++) {
this._seq.push(setTimeout(() => this.setState({ flick: true, lit: true }), t));
t += ON;
this._seq.push(setTimeout(() => this.setState({ flick: true, lit: false }), t));
t += OFF;
}
this._seq.push(setTimeout(() => this.setState({ flick: false, lit: false, done: true }), t));
}
lampStop() {
try { (this._seq || []).forEach(clearTimeout); } catch (e) {}
this._seq = [];
this._lampOn = true;
try { if (this._lampIO) { this._lampIO.disconnect(); this._lampIO = null; } } catch (e) {}
}
componentWillUnmount() {
try { clearTimeout(this._lit); } catch (e) {}
this.lampStop();
try { document.removeEventListener('visibilitychange', this._lampVis); } catch (e) {}
try { window.removeEventListener('pageshow', this._lampVis); } catch (e) {}
try { if (this._lampBack) { this._lampBack.disconnect(); this._lampBack = null; } } catch (e) {}
}
renderVals() {
const st = this.state || {};
return {
lit: st.lit ? ' ph-lit' : '',
flick: st.flick ? ' ph-flick' : '',
// the hint waits for the flicker to finish, then goes once the drawing is tapped
hint: (st.done && !st.touched) ? ' ph-on' : ' ph-off',
light: () => {
try { clearTimeout(this._lit); } catch (e) {}
// a tap during the strikes ends them rather than fighting them
this.lampStop();
this.setState({ lit: true, touched: true, flick: false, done: true });
this._lit = setTimeout(() => this.setState({ lit: false }), 1600);
}
};
}
}
</script>
