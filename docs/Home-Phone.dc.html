<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio homepage — phone</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Bebas Neue';src:url('./assets/52846e07bbe4848363c5a3aad3642df9.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}

/* every class here is ph- prefixed: this artboard is mounted inside the
   desktop page, so the two stylesheets share one document */
.ph-home{position:relative;box-sizing:border-box;display:flex;flex-direction:column;
width:100%;min-height:100vh;min-height:100dvh;padding:18px 18px 26px;
background-color:#FEF9ED;
background-image:linear-gradient(to right,rgba(36,25,16,0.055) 1px,transparent 1px),
linear-gradient(to bottom,rgba(36,25,16,0.055) 1px,transparent 1px);
background-size:26px 26px;color:#241910;
font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:300;overflow-x:hidden}
.ph-wrap{display:flex;flex-direction:column;flex:1 1 auto;width:100%;max-width:430px;margin:0 auto}

.ph-nav{display:flex;align-items:center;justify-content:center;gap:10px;padding:2px 0 0}
.ph-navlink{position:relative;display:inline-flex;align-items:center;padding:9px 16px;
text-decoration:none;-webkit-tap-highlight-color:transparent}
.ph-navlink img{display:block;height:24px;width:auto}
.ph-ring{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ph-ring path{fill:none;stroke:#C8432B;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
vector-effect:non-scaling-stroke;stroke-dasharray:1200;stroke-dashoffset:1200}
.ph-navlink:active .ph-ring path,.ph-navlink:focus-visible .ph-ring path{
animation:ph-circle 420ms cubic-bezier(.35,.75,.4,1) forwards}
@keyframes ph-circle{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
.ph-navlink:focus{outline:none}

/* the drawing and the greeting share the middle, centred together */
.ph-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;
flex:1 1 auto;gap:22px;padding:10px 0 4px}

.ph-art{position:relative;display:block;width:100%;padding:0;border:0;background:transparent;
cursor:pointer;-webkit-tap-highlight-color:transparent}
.ph-art img{display:block;width:100%;height:auto}
.ph-art .ph-plant,.ph-art .ph-beams{position:absolute;left:0;top:0;width:100%;height:100%}
.ph-plant{transform-origin:8% 88%}
.ph-beams{pointer-events:none;opacity:0;transition:opacity 420ms ease}
.ph-art.ph-lit .ph-beams{opacity:1}
.ph-art.ph-lit .ph-room{animation:ph-shake 640ms ease-in-out}
.ph-art.ph-lit .ph-plant{animation:ph-leaf 820ms ease-in-out}
@keyframes ph-shake{
0%,100%{transform:translate(0,0) rotate(0deg)}
18%{transform:translate(-2.5px,1px) rotate(-0.22deg)}
38%{transform:translate(2.5px,-1.5px) rotate(0.28deg)}
58%{transform:translate(-1.8px,-1px) rotate(-0.18deg)}
80%{transform:translate(1.4px,1px) rotate(0.12deg)}}
@keyframes ph-leaf{
0%,100%{transform:rotate(0deg) translate(0,0)}
14%{transform:rotate(-1.5deg) translate(-1.5px,0)}
32%{transform:rotate(1.7deg) translate(1.5px,-1.5px)}
52%{transform:rotate(-1.1deg) translate(-1px,1px)}
74%{transform:rotate(0.8deg) translate(1px,0)}}

.ph-greet{margin:0;font-family:'Bebas Neue','Helvetica Neue',Helvetica,Arial,sans-serif;
font-weight:400;font-size:26px;letter-spacing:0.12em;text-indent:0.12em;line-height:1.25;
text-align:center;text-transform:uppercase;color:#241910}

.ph-hint{margin:0;padding-top:2px;text-align:center;color:#9C9795;font-size:9px;
letter-spacing:0.2em;text-transform:uppercase;font-weight:500;
transition:opacity 300ms ease}
.ph-hint.ph-off{opacity:0}

@media (prefers-reduced-motion:reduce){
.ph-art.ph-lit .ph-room,.ph-art.ph-lit .ph-plant{animation:none}
.ph-ring path{stroke-dashoffset:0}
.ph-navlink:active .ph-ring path{animation:none}}
</style>
</helmet>

</button>

</div>

<p class="ph-hint{{hint}}">Tap the drawing</p>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
componentWillUnmount() {
try { clearTimeout(this._lit); } catch (e) {}
}
renderVals() {
const st = this.state || {};
return {
lit: st.lit ? ' ph-lit' : '',
hint: st.touched ? ' ph-off' : '',
light: () => {
try { clearTimeout(this._lit); } catch (e) {}
this.setState({ lit: true, touched: true });
this._lit = setTimeout(() => this.setState({ lit: false }), 1600);
}
};
}
}
</script>
