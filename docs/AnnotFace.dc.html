<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Character face</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.pf-rock{display:block;transform-origin:50% 88%}
.pf-rock-s{animation:pf-jit-s .62s steps(1,end) infinite}
.pf-rock-m{animation:pf-jit-m .46s steps(1,end) infinite}
.pf-rock-l{animation:pf-jit-l .34s steps(1,end) infinite}
@keyframes pf-jit-s{0%{transform:rotate(-1.6deg) translateY(0)}33%{transform:rotate(0deg) translateY(-2px)}66%{transform:rotate(1.6deg) translateY(0)}}
@keyframes pf-jit-m{0%{transform:rotate(-3deg) translateY(0)}33%{transform:rotate(0deg) translateY(-3px)}66%{transform:rotate(3deg) translateY(1px)}}
@keyframes pf-jit-l{0%{transform:rotate(-5deg) translateY(1px)}33%{transform:rotate(0deg) translateY(-4px)}66%{transform:rotate(5deg) translateY(0)}}
@media (prefers-reduced-motion:reduce){.pf-rock-s,.pf-rock-m,.pf-rock-l{animation:none}}
</style>
</helmet>
<div class="pf-rock{{rockCls}}" style="animation-duration: {{speed}}; transform: rotate({{rot}});">
<sc-if value="{{is_neutral}}" hint-placeholder-val="{{ false }}">
<img src="./assets/ebe0893dcc11496b7142d28c2f2cc724.png" alt="Shanmathi’s character, neutral expression" style="display: block; width: 100%; height: auto;">
</sc-if>
<sc-if value="{{is_smile}}" hint-placeholder-val="{{ true }}">
<img src="./assets/d33f592cedaa2de061ca10ac1e34a036.png" alt="Shanmathi’s character, smile expression" style="display: block; width: 100%; height: auto;">
</sc-if>
<sc-if value="{{is_curious}}" hint-placeholder-val="{{ false }}">
<img src="./assets/94467658b030d7c046a9c857836a1642.png" alt="Shanmathi’s character, curious expression" style="display: block; width: 100%; height: auto;">
</sc-if>
<sc-if value="{{is_thoughtful}}" hint-placeholder-val="{{ false }}">
<img src="./assets/24459019e56c07073d97fdf6ba1c4676.png" alt="Shanmathi’s character, thoughtful expression" style="display: block; width: 100%; height: auto;">
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"face": {"editor": "enum", "options": ["neutral", "smile", "curious", "thoughtful"], "default": "smile"}, "motion": {"editor": "enum", "options": ["on", "off"], "default": "on"}, "intensity": {"editor": "enum", "options": ["subtle", "normal", "lively"], "default": "normal"}, "speed": {"editor": "text", "default": "0.46s"}, "rot": {"editor": "text", "default": "0deg"}, "$preview": {"width": 150, "height": 116}}'>
class Component extends DCLogic {
renderVals() {
const p = this.props;
const f = p.face ?? 'smile';
const on = (p.motion ?? 'on') === 'on';
const cls = { subtle: ' pf-rock-s', normal: ' pf-rock-m', lively: ' pf-rock-l' };
return {
is_neutral: f === 'neutral', is_smile: f === 'smile',
is_curious: f === 'curious', is_thoughtful: f === 'thoughtful',
rockCls: on ? (cls[p.intensity ?? 'normal'] || ' pf-rock-m') : '',
speed: p.speed ?? '0.46s', rot: p.rot ?? '0deg'
};
}
}
</script>
</body>
</html>
