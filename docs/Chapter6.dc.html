<style>
body{margin:0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#262525;background:#FBF6E6}
a{color:inherit;text-decoration:none}a:hover{color:#786653}
button{font:inherit;color:inherit}
img{max-width:100%}
@font-face{font-family:'Penpoint';src:url('./assets/e9d9f28ee1522a75635f0352c96fc9a9.otf');font-weight:400;font-style:normal;font-display:swap}

/* --- the page drops in, and leaves no clip behind --- */
@keyframes pf-drop{from{opacity:0;transform:translateY(-48px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:translateY(0);clip-path:inset(0 0 0 0)}}
.pf-drop{animation:pf-drop 900ms cubic-bezier(.2,.8,.2,1) backwards}
@media (prefers-reduced-motion: reduce){.pf-drop{animation:none}}
@keyframes pf-marquee{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.pf-marquee{animation:pf-marquee 34s linear infinite}
@media (prefers-reduced-motion: reduce){.pf-marquee{animation:none}}

/* --- hero carousel: manual only, no hover swap, no auto advance --- */
.pf-layer{transition:opacity 420ms ease}
.pf-herowrap{cursor:pointer}
.pf-fit-contain .pf-layer img{width:100%!important;height:100%!important;object-fit:contain!important}
.pf-fit-cover .pf-layer img{width:100%!important;height:100%!important;object-fit:cover!important}
.pf-glass{position:absolute;top:50%;z-index:6;display:flex;align-items:center;justify-content:center;
width:54px;height:54px;margin-top:-27px;padding:0 0 5px;border:1px solid rgba(255,255,255,0.55);
border-radius:50%;background:rgba(254,249,237,0.26);
backdrop-filter:blur(10px) saturate(1.35);-webkit-backdrop-filter:blur(10px) saturate(1.35);
box-shadow:0 8px 24px rgba(36,25,16,0.18),inset 0 1px 0 rgba(255,255,255,0.65);
color:#241910;font-size:28px;line-height:1;cursor:pointer;
opacity:0;transition:opacity 260ms ease,transform 220ms ease}
.pf-herowrap:hover .pf-glass,.pf-herowrap:focus-within .pf-glass{opacity:1}
.pf-glass:hover{transform:scale(1.09);background:rgba(254,249,237,0.4)}
.pf-timelabel{position:absolute;left:50%;bottom:26px;z-index:6;transform:translateX(-50%);
padding:8px 18px;border:1px solid rgba(255,255,255,0.5);border-radius:999px;
background:rgba(254,249,237,0.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
box-shadow:0 6px 18px rgba(36,25,16,0.14),inset 0 1px 0 rgba(255,255,255,0.6);
color:#241910;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;font-weight:500;
opacity:0;transition:opacity 260ms ease;pointer-events:none}
.pf-herowrap:hover .pf-timelabel,.pf-herowrap:focus-within .pf-timelabel{opacity:1}
@media (hover:none){.pf-glass,.pf-timelabel{opacity:1}}
.pf-dots{display:flex;justify-content:center;gap:10px;margin-top:16px}
.pf-dot{width:9px;height:9px;padding:0;border-radius:50%;cursor:pointer;
transition:transform 200ms ease,background-color 200ms ease,border-color 200ms ease}
.pf-dot:hover{transform:scale(1.2)}

/* --- mood boards: four square tiles trading places --- */
.pf-mbgrid{position:relative;box-sizing:border-box;overflow:hidden}
.pf-mbcell{position:absolute;left:0;top:0;box-sizing:border-box;overflow:hidden;
width:calc(50% - var(--pf-g) / 2);height:calc(50% - var(--pf-g) / 2);
border:1px solid rgba(38,37,37,0.28);
transform:translate(0px, 0px);
transition:transform var(--pf-move) cubic-bezier(.5, 0, .18, 1);will-change:transform}
.pf-mbcell img{width:100%!important;height:100%!important;object-fit:contain!important}
.pf-mbred{border-color:transparent}
.pf-mbopen{padding:0;background:none;font:inherit;color:inherit;cursor:zoom-in}
.pf-mbopen:focus-visible{outline:2px solid #C62B23;outline-offset:3px}

/* --- a board, opened over the page --- */
.pf-lb{position:fixed;left:0;top:0;right:0;bottom:0;z-index:90;display:flex;align-items:center;
justify-content:center;padding:40px 76px;background:rgba(11,11,11,0.84);
-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:pf-lbin 220ms ease both}
@keyframes pf-lbin{from{opacity:0}to{opacity:1}}
.pf-lbveil{position:absolute;left:0;top:0;right:0;bottom:0;z-index:0;border:0;padding:0;
background:transparent;cursor:zoom-out}
.pf-lbframe{position:relative;z-index:2;box-sizing:border-box;width:min(1040px,100%);
height:min(80vh,880px);padding:10px;background:#FEF9ED;
box-shadow:0 30px 70px -30px rgba(0,0,0,0.75)}
.pf-lbslide{position:absolute;left:10px;top:10px;right:10px;bottom:10px;overflow:hidden}
.pf-lbslide img{width:100%!important;height:100%!important;object-fit:contain!important}
.pf-lbbtn{position:absolute;z-index:4;display:flex;align-items:center;justify-content:center;
width:46px;height:46px;padding:0 0 3px;border:1px solid rgba(254,249,237,0.5);border-radius:50%;
background:rgba(254,249,237,0.14);color:#FEF9ED;font-size:26px;line-height:1;cursor:pointer;
transition:background-color 180ms ease,transform 180ms ease}
.pf-lbbtn:hover{background:rgba(254,249,237,0.32);transform:scale(1.07)}
.pf-lbprev{left:16px;top:50%;margin-top:-23px}
.pf-lbnext{right:16px;top:50%;margin-top:-23px}
.pf-lbclose{z-index:6;right:12px;top:12px;width:40px;height:40px;padding:0 0 2px;border-color:rgba(36,25,16,0.5);background:rgba(254,249,237,0.94);color:#241910;font-size:20px}
.pf-lbclose:hover{background:#241910;color:#FEF9ED}
.pf-lb:focus,.pf-lb:focus-visible{outline:none}
.pf-lbcount{position:absolute;left:50%;bottom:16px;z-index:4;transform:translateX(-50%);
color:rgba(254,249,237,0.78);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;
font-weight:500}
@media (max-width:760px){.pf-lb{padding:14px}.pf-lbframe{height:64vh}
.pf-lbprev{left:4px}.pf-lbnext{right:4px}}
@media (prefers-reduced-motion:reduce){.pf-lb{animation:none}}
@media (prefers-reduced-motion:reduce){.pf-mbcell{transition:none}}
.pf-mob .pf-herowrap{width:auto !important;padding-left:0 !important}
.pf-mob .pf-mbgrid{width:100% !important}

/* --- taped notepad, the CV page's paper --- */
.pf-hand{font-family:'Penpoint','Bradley Hand','Segoe Print',cursive;font-weight:400}
.pf-npaper{position:relative;box-sizing:border-box;
background-image:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(36,25,16,0.09) 27px 28px);
box-shadow:0 1px 0 rgba(36,25,16,0.10),0 14px 30px -20px rgba(36,25,16,0.55)}
.pf-ntape{position:absolute;background-color:rgba(214,196,170,0.6);
border-left:1px solid rgba(36,25,16,0.12);border-right:1px solid rgba(36,25,16,0.12)}


.pf-fnav{position:absolute;top:50%;z-index:4;transform:translateY(-50%);color:#241910;font-size:17px;line-height:1}
.pf-fcontacts{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:18px 36px;border-top:1px solid rgba(36,25,16,0.25);background-color:#FEF9ED}
.pf-hero.pf-ndemo .pf-day{opacity:0 !important}
.pf-hero.pf-ndemo .pf-night{opacity:1 !important}
.pf-mob .pf-fcontacts{grid-template-columns:1fr !important;justify-items:center;gap:12px;text-align:center}
.pf-mob .pf-fnav{position:static !important;transform:none !important;display:block;text-align:center;margin:6px 0}
.pf-mob .pf-fnavrow{display:block !important;padding:10px 0 !important}

/* pf-fit-pass — one fixed layout, scaled to fit any window */
html,body{overflow-x:hidden}
.pf-stage{width:100%;overflow:hidden}
.pf-fit{width:1440px;transform-origin:top left;will-change:transform}

/* --- below 760px the notepad sits above the carousel --- */
.pf-fit.pf-mob{width:100% !important;transform:none !important;margin-left:0 !important}
.pf-mob .pf-introgrid{display:block !important;height:auto !important;min-height:0 !important;padding:18px 16px 40px !important}
.pf-mob .pf-aside{position:static !important;width:auto !important;margin-bottom:26px}
.pf-mob .pf-herocol{width:auto !important;max-width:none !important;height:auto !important}
.pf-mob .pf-herowrap{max-width:none !important;height:auto !important}

.pf-mob .pf-heroannot{display:none}
.pf-mob .pf-heropage{min-height:0 !important}
</style>

&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#FFFFFF&quot;}, &quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900}}">
class Component extends DCLogic {
pfFit() {
try {
const stage = document.getElementById('pf-stage-Chapter6');
const fit = document.getElementById('pf-fit-Chapter6');
if (!stage || !fit) return;
const w = stage.clientWidth || document.documentElement.clientWidth || 1440;
const mob = w > 0 && w < 760;

if (mob) { fit.style.transform = ''; fit.style.marginLeft = ''; stage.style.height = ''; return; }
const s = Math.min(1, w / 1440);

fit.style.marginLeft = Math.max(0, (w - 1440 * s) / 2) + 'px';

} catch (e) {}
}
pfFitBind() {

try { window.addEventListener('resize', this._pfFit); } catch (e) {}

if (typeof ResizeObserver !== 'undefined') {
this._pfRO = new ResizeObserver(this._pfFit);
this._pfRO.observe(document.getElementById('pf-fit-Chapter6'));
}
} catch (e) {}

}
componentDidMount() { this.pfFitBind(); this.mbBind(); try { window.scrollTo(0, 0); } catch (e) {} }
componentWillUnmount() {
this.mbFree();
try { window.removeEventListener('resize', this._pfFit); } catch (e) {}
try { if (this._pfRO) { this._pfRO.disconnect(); this._pfRO = null; } } catch (e) {}
}
mbEl() { try { return document.getElementById('pf-mbgrid-Chapter6'); } catch (e) { return null; } }
mbReduced() {
try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
}
mbCanRun() {
return !this.mbReduced()
&& (this.props.shuffle ?? 'playing') !== 'paused'
&& this._mbVis !== false
&& this._mbHidden !== true
&& this._mbLb !== true;
}
mbApply() {
const g = this.mbEl();
if (!g) return;
const off = 'calc(100% + ' + (this._mbGap || '10px') + ')';
const pos = this._mbPos || [0, 1, 2, 3];
const tiles = g.querySelectorAll('[data-pf-tile]');
for (let i = 0; i < tiles.length; i++) {
const t = tiles[i];
const p = typeof pos[i] === 'number' ? pos[i] : i;
const tf = 'translate(' + ((p % 2) ? off : '0px') + ', ' + ((p > 1) ? off : '0px') + ')';
if (t.style.transform === tf) continue;
// a re-render can hand back a fresh element: place it with no transition,
// otherwise every tile would slide in from the top-left corner
const fresh = !t.style.transform;
if (fresh) t.style.transition = 'none';
t.style.transitionDelay = (i * 70) + 'ms';
t.style.transform = tf;
if (fresh) { void t.offsetWidth; t.style.transition = ''; }
}
}
mbShuffle() {
// a permutation: every tile lands somewhere, every cell gets exactly one tile
const cur = this._mbPos || [0, 1, 2, 3];
let next = cur, guard = 0;
while (guard < 40) {
guard++;
const a = [0, 1, 2, 3];
for (let i = 3; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
const t = a[i]; a[i] = a[j]; a[j] = t;
}
let same = true;
for (let i = 0; i < 4; i++) { if (a[i] !== cur[i]) { same = false; break; } }
if (!same) { next = a; break; }
}
this._mbPos = next;
this.mbApply();
}
mbLoop() {
this._mbT = null;
if (!this.mbCanRun()) return;
this.mbShuffle();
this._mbT = setTimeout(() => this.mbLoop(), this._mbHold || 1200);
}
mbArm() {
if (this._mbT || !this.mbCanRun()) return;
this._mbT = setTimeout(() => this.mbLoop(), this._mbHold || 1200);
}
mbDisarm() { try { clearTimeout(this._mbT); } catch (e) {} this._mbT = null; }
mbRead() {
const p = this.props;
this._mbGap = String(p.gap ?? '10px').trim();
this._mbMove = Math.max(120, parseInt(p.moveMs ?? '800', 10) || 800);
const _h = Math.max(300, parseInt(p.holdMs ?? '1200', 10) || 1200);
this._mbHold = Math.max(_h, this._mbMove + 150);
}
mbSync() {
this._mbPend = false;
const p = this.props;
const sig = [p.shuffle ?? 'playing', p.holdMs ?? '1200', p.moveMs ?? '800', p.gap ?? '10px',
this._mbLb ? 'lb' : '-'].join('|');
this.mbRead();
this.mbApply();

this._mbSig = sig;
this.mbDisarm();
this.mbArm();

mbBind() {
const g = this.mbEl();
if (!g) return;

this._mbPos = [0, 1, 2, 3];
this.mbApply();

if (typeof IntersectionObserver !== 'undefined') {
this._mbIO = new IntersectionObserver((es) => {
es.forEach((e) => {

if (e.isIntersecting) this.mbArm(); else this.mbDisarm();
});
}, { threshold: 0.05 });
this._mbIO.observe(g);
}
} catch (e) {}

this._mbHidden = !!document.hidden;
if (this._mbHidden) this.mbDisarm(); else this.mbArm();
};
try { document.addEventListener('visibilitychange', this._mbVisH); } catch (e) {}
this.mbArm();
}

this.mbDisarm();
try { if (this._mbIO) { this._mbIO.disconnect(); this._mbIO = null; } } catch (e) {}
try { document.removeEventListener('visibilitychange', this._mbVisH); } catch (e) {}
}
lbKeyBind() {
const el = document.getElementById('pf-lb-Chapter6');

// element-scoped, never on the document: this platform forbids that, and it
// is also what lets one Escape close the viewer and the next one leave Play
this._lbKey = (e) => {

e.preventDefault();
e.stopPropagation();
try { e.stopImmediatePropagation(); } catch (err) {}

} catch (err) {}
};

try { el.focus(); } catch (e2) {}
}
}

const p = this.props;
const a = p.accent ?? '#786653';
const st = this.state || {};
const n = Math.max(1, Math.min(6, parseInt(p.heroCount ?? '4', 10) || 1));
const i = Math.min(Math.max(0, st.h || 0), n - 1);
const pad = (k) => (k < 10 ? '0' : '') + k;
const v = {
accent: a,
title: p.title ?? 'Rooms, drawn out!',
slogan: p.slogan ?? 'A room is a verb. It keeps happening.',
tagline: p.tagline ?? 'The premise for this room is waiting in the editing workspace.',
note: p.note ?? 'mood boards',
noteSize: p.noteSize ?? '40px',
noteColor: p.noteColor ?? '#C62B23',
noteLead: p.noteLead ?? '1.02',
noteTrack: p.noteTrack ?? '0.01em',
noteAlign: p.noteAlign ?? 'left',
notePaper: p.notePaper ?? '#FDF7EA',
paper: p.paper ?? '#FBF6E6',
gridOp: p.gridOp ?? '0.17',
gridStep: p.gridStep ?? '17px',

hLabel: pad(i + 1) + ' / ' + pad(n)
};
for (let k = 0; k < 6; k++) {
const on = k === i;
v['hO' + k] = on ? 1 : 0; v['hZ' + k] = on ? 2 : 1; v['hP' + k] = on ? 'auto' : 'none';
v['dD' + k] = k < n ? 'block' : 'none';
v['dBg' + k] = on ? a : 'transparent';
v['dBd' + k] = on ? a : '#9C9795';
v['pick' + k] = () => this.setState({ h: k });
}
v.hNext = () => this.setState({ h: (i + 1) % n });
v.hPrev = () => this.setState({ h: (i + n - 1) % n });
v.ig = this.props.ig ?? 'shansivakumar';
v.mail = this.props.mail ?? 'shanmathisivakumar30@gmail.com';
v.prevLabel = this.props.prevLabel ?? 'previous project';
v.nextLabel = this.props.nextLabel ?? 'next project';
const _lb = typeof st.lb === 'number' ? st.lb : -1;
this._mbLb = _lb >= 0;
v.lbOpen = _lb >= 0;
v.lbLabel = (_lb >= 0 ? '0' + (_lb + 1) : '00') + ' / 03';
v.lbClose = () => this.setState({ lb: -1 });
v.lbNext = () => this.setState({ lb: (_lb + 1) % 3 });
v.lbPrev = () => this.setState({ lb: (_lb + 2) % 3 });
this._lbActs = { close: v.lbClose, next: v.lbNext, prev: v.lbPrev };
if (!this._lbPend) {
this._lbPend = true;
try { setTimeout(() => { this._lbPend = false; this.lbKeyBind(); }, 0); }
catch (e) { this._lbPend = false; }
}

for (let k = 0; k < 3; k++) {
v['lbD' + k] = k === _lb ? 'block' : 'none';
v['open' + (k + 1)] = () => this.setState({ lb: k });
}
v.boardSize = p.boardSize ?? '520px';
v.gap = p.gap ?? '10px';
v.moveMs = (Math.max(120, parseInt(p.moveMs ?? '800', 10) || 800)) + 'ms';
v.redColor = p.redColor ?? '#C62B23';
v.tileBg1 = p.tileBg1 ?? '#FFFFFF';
v.tileBg2 = p.tileBg2 ?? '#FFFFFF';
v.tileBg3 = p.tileBg3 ?? '#FFFFFF';
if (!this._mbPend) { this._mbPend = true; try { setTimeout(() => this.mbSync(), 0); } catch (e) { this._mbPend = false; } }
return v;
}
}
