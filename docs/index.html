<helmet>
<style>
body{margin:0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#241910;background:#FEF9ED}
a{color:inherit;text-decoration:none}
img{max-width:100%}


/* --- Bebas Neue, per the Photoshop spec: 36pt, tracking 180 --- */
@font-face{font-family:'Bebas Neue';src:url('./assets/52846e07bbe4848363c5a3aad3642df9.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}

/* --- illustration: layered so the plant can move on its own --- */
.pf-art{position:relative;display:block;width:100%;max-width:960px}
.pf-art img{display:block;width:100%;height:auto}
.pf-art .pf-plant,.pf-art .pf-beams{position:absolute;left:0;top:0;width:100%;height:100%}
.pf-plant{transform-origin:8% 88%}
.pf-beams{pointer-events:none;opacity:0;transition:opacity 420ms ease}
.pf-main:hover .pf-beams,.pf-main:focus-within .pf-beams{opacity:1}
.pf-main:hover .pf-room,.pf-main:focus-within .pf-room{animation:pf-shake 640ms ease-in-out}
.pf-main:hover .pf-plant,.pf-main:focus-within .pf-plant{animation:pf-leaf 820ms ease-in-out}
@keyframes pf-shake{
0%,100%{transform:translate(0,0) rotate(0deg)}
18%{transform:translate(-2.5px,1px) rotate(-0.22deg)}
38%{transform:translate(2.5px,-1.5px) rotate(0.28deg)}
58%{transform:translate(-1.8px,-1px) rotate(-0.18deg)}
80%{transform:translate(1.4px,1px) rotate(0.12deg)}}
@keyframes pf-leaf{
0%,100%{transform:rotate(0deg) translate(0,0)}
14%{transform:rotate(-1.5deg) translate(-1.5px,0)}
32%{transform:rotate(1.7deg) translate(1.5px,-1.5px)}
52%{transform:rotate(-1.1deg) translate(-1px,1px)}
74%{transform:rotate(0.8deg) translate(1px,0)}}

/* --- nav labels nudge with the circle --- */
.pf-nav:hover img,.pf-nav:focus-visible img{animation:pf-nudge 460ms ease-in-out}
@keyframes pf-nudge{
0%,100%{transform:translate(0,0) rotate(0deg)}
22%{transform:translate(-1.6px,0.8px) rotate(-0.7deg)}
46%{transform:translate(1.6px,-0.8px) rotate(0.8deg)}
72%{transform:translate(-0.9px,0.4px) rotate(-0.4deg)}}

/* --- typeset greeting --- */
.pf-greet{margin:0;font-family:'Bebas Neue','Helvetica Neue',Helvetica,Arial,sans-serif;
font-weight:400;font-size:48px;letter-spacing:0.18em;text-indent:0.18em;line-height:1.1;
text-align:center;color:#241910;text-transform:uppercase}

/* --- the studio wordmark, left of the nav and on the same line. The
       same 24px inset as a nav link, so both ends of the row match. --- */
.pf-logo{display:inline-flex;align-items:center;margin-right:auto;padding:15px 24px}
.pf-logo img{display:block;height:var(--logo-h,40px);width:auto}
/* the two nav words carry their heights inline on the images, which
   out-ranks a plain rule - hence important. They move together, in the
   27 / 26 they were drawn at, so one number keeps them balanced. */
.pf-navbar .pf-ink-abt{height:var(--nav-h,27px)!important}
.pf-navbar .pf-ink-prj{height:calc(var(--nav-h,27px) * 26 / 27)!important}

/* --- navigation: handwriting + a quick red circle on hover/focus --- */
.pf-nav{position:relative;display:inline-flex;align-items:center;padding:15px 24px}
.pf-ring{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pf-ring path{fill:none;stroke:#C8432B;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1200;stroke-dashoffset:1200;vector-effect:non-scaling-stroke}
.pf-ring .r1{stroke-width:3}
.pf-ring .r2{stroke-width:2.4;opacity:.6}
.pf-nav:hover .r1,.pf-nav:focus-visible .r1{animation:pf-circle 400ms cubic-bezier(.35,.75,.4,1) forwards}
.pf-nav:hover .r2,.pf-nav:focus-visible .r2{animation:pf-circle 280ms cubic-bezier(.35,.75,.4,1) 180ms forwards}
@keyframes pf-circle{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
.pf-nav:focus{outline:none}
.pf-nav:focus-visible{outline:none}

/* --- entrance after the name animation --- */
.pf-hide{opacity:0}
.pf-enter{animation:pf-fade 900ms cubic-bezier(.3,.7,.3,1) both}
@keyframes pf-fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pf-veil{animation:pf-veil 2.65s linear both}
@keyframes pf-veil{0%,91%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){
.pf-enter,.pf-veil{animation:none;opacity:1}
.pf-ring path{stroke-dashoffset:0}
.pf-nav .r1,.pf-nav .r2{opacity:0;transition:opacity 120ms}
.pf-nav:hover .r1,.pf-nav:focus-visible .r1{animation:none;opacity:1}
.pf-nav:hover .r2,.pf-nav:focus-visible .r2{animation:none;opacity:.6}
.pf-main:hover .pf-room,.pf-main:hover .pf-plant,.pf-nav:hover img{animation:none !important}
}

@media (hover:none){
.pf-main:active .pf-beams{opacity:1}
.pf-main:active .pf-room{animation:pf-shake 640ms ease-in-out}
.pf-main:active .pf-plant{animation:pf-leaf 820ms ease-in-out}
}

/* --- phone layout lives in its own artboard; this picks between them --- */
.pf-rt{width:100%}
.pf-phoneslot{width:100%}
.pf-phoneslot > *{width:100%}

/* pf-fit-pass — one fixed layout, scaled to fit any window */
html,body{margin:0;overflow-x:hidden}
.pf-stage{width:100%;overflow:hidden}
.pf-fit{width:1440px;transform-origin:top left;will-change:transform}
</style>

<script type="text/x-dc" data-dc-script data-props='{"intro": {"editor": "enum", "options": ["once per visit", "every time", "off"], "default": "once per visit"}, "logoSize": {"editor": "text", "default": "40px", "section": "Header"}, "navSize": {"editor": "text", "default": "27px", "section": "Header"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
// How tall the wordmark and the two nav words stand. Written as custom
// properties rather than onto the elements, so a drag in the properties
// panel cannot wipe them out.
hdType() {
try {
const r = document.documentElement;
if (!r) return;
const p = this.props;
r.style.setProperty('--logo-h', p.logoSize ?? '40px');
r.style.setProperty('--nav-h', p.navSize ?? '27px');
} catch (e) {}
}

pfFit() {
try {
const stage = document.getElementById('pf-stage-Home');
const fit = document.getElementById('pf-fit-Home');
if (!stage || !fit) return;
const w = stage.clientWidth || document.documentElement.clientWidth || 1440;
// the sheet has to come down to fit the window both ways. Scaling on the
// width alone is what left the foot of the page below the fold.
const vh = document.documentElement.clientHeight || window.innerHeight || 900;
const h = fit.offsetHeight || 900;
const s = Math.min(1, w / 1440, vh / h);
fit.style.transform = 'scale(' + s + ')';
// whichever axis had room to spare, the sheet sits in the middle of it
fit.style.marginLeft = Math.max(0, (w - 1440 * s) / 2) + 'px';
fit.style.marginTop = Math.max(0, (vh - h * s) / 2) + 'px';
stage.style.height = Math.max(Math.ceil(h * s), vh) + 'px';
} catch (e) {}
}
pfFitBind() {
this._pfFit = () => this.pfFit();
this.pfFit();
try { window.addEventListener('resize', this._pfFit); } catch (e) {}
try {
if (typeof ResizeObserver !== 'undefined') {
this._pfRO = new ResizeObserver(this._pfFit);
this._pfRO.observe(document.getElementById('pf-fit-Home'));
}
} catch (e) {}
try { setTimeout(this._pfFit, 120); setTimeout(this._pfFit, 700); } catch (e) {}
}
pfFitFree() {
try { window.removeEventListener('resize', this._pfFit); } catch (e) {}
try { if (this._pfRO) { this._pfRO.disconnect(); this._pfRO = null; } } catch (e) {}
}

componentDidMount() {
this.hdType();
this.rtBind();
this.pfFitBind();
try { window.scrollTo(0, 0); } catch (e) {}
if (!this.introSkipped()) this.startIntro();
}
componentWillUnmount() {
this.rtFree();
this.pfFitFree(); clearTimeout(this.introTimer); }
introSkipped() {
if (this._init === undefined) {
const mode = this.props.intro ?? 'once per visit';
let seen = false;
try { seen = sessionStorage.getItem('pf-home-intro') === '1'; } catch (e) {}
this._init = mode === 'off' || (mode === 'once per visit' && seen);
}
return this._init;
}
startIntro() {
try { sessionStorage.setItem('pf-home-intro', '1'); } catch (e) {}
clearTimeout(this.introTimer);
this.introTimer = setTimeout(() => this.setState({ introDone: true }), 2650);
}
rtWide() {
try {
const el = document.getElementById('pf-rt-Home');
const w = (el && el.clientWidth) || 0;
// no box yet: keep the desktop arm, which is what this page has always shown
if (!w) return true;
return w > 760;
} catch (e) { return true; }
}
rtSync() {
const wide = this.rtWide();
if (((this.state || {}).wide) === wide) return;
this.setState({ wide: wide });
// the scale-to-fit box is a different element on the other side of the switch
try { setTimeout(() => { try { this.pfFit(); } catch (e) {} }, 0); } catch (e) {}
}
rtBind() {
this.rtSync();
this._rt = () => this.rtSync();
try { window.addEventListener('resize', this._rt); } catch (e) {}
try {
if (typeof ResizeObserver !== 'undefined') {
const el = document.getElementById('pf-rt-Home');
if (el) { this._rtRO = new ResizeObserver(this._rt); this._rtRO.observe(el); }
}
} catch (e) {}
}
rtFree() {
try { window.removeEventListener('resize', this._rt); } catch (e) {}
try { if (this._rtRO) { this._rtRO.disconnect(); this._rtRO = null; } } catch (e) {}
}
renderVals() {
this.hdType();
const st = this.state || {};
const done = st.introDone ?? this.introSkipped();
const v = {
showIntro: !done,
enter: done ? ' pf-enter' : '',
skipIntro: () => { clearTimeout(this.introTimer); this.setState({ introDone: true }); }
};
const _wide = ((this.state || {}).wide) !== false;
v.desk = _wide;
v.phone = !_wide;
return v;
}
}
</script>
