<script type="text/x-dc" data-dc-script data-props='{"tileW": {"editor": "text", "default": "520"}, "tileRatio": {"editor": "text", "default": "1.79"}, "viewCount": {"editor": "enum", "options": ["1","2","3","4","5","6","7","8"], "default": "5"}, "title": {"editor": "text", "default": "Few loose frames"}, "gridOp": {"editor": "text", "default": "0.17"}, "gridStep": {"editor": "text", "default": "17px"}, "paper": {"editor": "color", "default": "#FBF6E6"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
pfFit() {
try {
const stage = document.getElementById('pf-stage-Chapter7');
const fit = document.getElementById('pf-fit-Chapter7');
if (!stage || !fit) return;
const w = stage.clientWidth || document.documentElement.clientWidth || 1440;
const s = Math.min(1, w / 1440);
fit.style.transform = 'scale(' + s + ')';
fit.style.marginLeft = Math.max(0, (w - 1440 * s) / 2) + 'px';
stage.style.height = Math.ceil(fit.offsetHeight * s) + 'px';
} catch (e) {}
}
pfFitBind() {
this._pfFit = () => this.pfFit();
this.pfFit();
try { window.addEventListener('resize', this._pfFit); } catch (e) {}
try {
if (typeof ResizeObserver !== 'undefined') {
this._pfRO = new ResizeObserver(this._pfFit);
this._pfRO.observe(document.getElementById('pf-fit-Chapter7'));
}
} catch (e) {}
try { setTimeout(this._pfFit, 120); setTimeout(this._pfFit, 700); } catch (e) {}
}
pfFitFree() {

}
rtWide() {
try {
const el = document.getElementById('pf-rt-Chapter7');
const w = (el && el.clientWidth) || 0;

return w > 760;
} catch (e) { return true; }
}
rtSync() {
const wide = this.rtWide();

this.setState({ wide: wide });
try { setTimeout(() => { try { this.pfFit(); } catch (e) {} }, 0); } catch (e) {}
}
rtBind() {

this._rt = () => this.rtSync();
try { window.addEventListener('resize', this._rt); } catch (e) {}
try {
if (typeof ResizeObserver !== 'undefined') {
const el = document.getElementById('pf-rt-Chapter7');
if (el) { this._rtRO = new ResizeObserver(this._rt); this._rtRO.observe(el); }
}

}

try { window.removeEventListener('resize', this._rt); } catch (e) {}
try { if (this._rtRO) { this._rtRO.disconnect(); this._rtRO = null; } } catch (e) {}
}

flN() {
const c = parseInt(this.props.viewCount ?? '5', 10);
return Math.max(1, Math.min(8, isNaN(c) ? 5 : c));
}
// the one size every frame takes, from the tweak rather than a drag
flTile() {
const w = parseFloat(this.props.tileW ?? '520');
const r = parseFloat(this.props.tileRatio ?? '1.79');
const cw = Math.round(Math.max(160, Math.min(900, isNaN(w) ? 520 : w)));
const ratio = (isNaN(r) || r <= 0) ? 1.79 : Math.max(0.4, Math.min(4, r));
return { w: cw, h: Math.round(cw / ratio), r: ratio };
}
flDeck() { try { return document.getElementById('fl-deck-Chapter7'); } catch (e) { return null; } }
flApply() {
const g = this.flDeck();
if (!g) return;
const n = this.flN(), mid = (n - 1) / 2, rot = this._rot || 0;
const t = this.flTile();
// the fan is laid out across the 1440px sheet; 1300 is the room it has
let cw = t.w, ch = t.h;
const droop = mid * 18;
if (ch + droop > 360) { ch = Math.max(90, Math.round(360 - droop)); cw = Math.round(ch * t.r); }
if (cw > 1300) { cw = 1300; ch = Math.round(cw / t.r); }
// the step between frames closes up rather than letting the fan
// run off the sheet, and never opens past half a frame
const hs = n > 1 ? Math.min(cw * 0.52, Math.max(cw * 0.18, (1300 - cw) / (n - 1))) : 0;
g.style.width = Math.round(cw + (n - 1) * hs) + 'px';
g.style.height = Math.round(ch + droop) + 'px';
const cards = g.querySelectorAll('[data-fl-card]');
for (let i = 0; i < cards.length; i++) {
const c = cards[i];
if (i >= n) { c.style.display = 'none'; continue; }
c.style.display = '';
c.style.width = cw + 'px';
c.style.height = ch + 'px';
c.style.marginLeft = (-cw / 2) + 'px';
c.style.marginTop = (-ch / 2) + 'px';
// a frame dragged in the editor leaves a left/top behind; put it back
c.style.left = '50%';
c.style.top = '50%';
c.style.right = '';
c.style.bottom = '';
const pos = (((i + rot) % n) + n) % n;
const off = pos - mid;
const tf = 'translate(' + (off * hs).toFixed(1) + 'px, '
+ (Math.abs(off) * 18).toFixed(1) + 'px) rotate(' + (off * 6).toFixed(2) + 'deg)';
// a card that has just been rendered is placed, not flown in from the middle
const fresh = !c.style.transform;
if (fresh) c.style.transition = 'none';
c.style.transform = tf;
c.style.zIndex = String(Math.round(n - Math.abs(off)));
if (fresh) { void c.offsetWidth; c.style.transition = ''; }

flTurn(d) {
const n = this.flN();

}
// one step, in whichever mode we are in. It reads the state when it fires
// rather than when it was bound: the runtime keeps the same element across
// renders, so a handler that closed over the index would stay on that index.
flStep(d) {

const cur = typeof st.open === 'number' ? st.open : -1;

flDisarm() { try { clearTimeout(this._t); } catch (e) {} this._t = null; }

const _wide = ((this.state || {}).wide) !== false;
